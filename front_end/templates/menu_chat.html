<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div style="width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div class="upload-form">
          <h1>Menu Chat</h1>
          <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".png,.jpg,.jpeg"><br>
            <input type="submit" value="Upload">
          </form>
        </div>
        {% if filename %}
          <h2>Uploaded: {{ filename }}</h2>
          <div class="doc-preview">
            <img src="{{ url_for('uploaded_file', filename=filename) }}" />
          </div>
        {% else %}
          <div class="no-doc">No document uploaded yet.</div>
        {% endif %}
      </div>
    </div>
    <div class="right-panel">
      {% if answer %}
        <div class="answer-box">
          <strong>Image Analysis:</strong>
          <div>{{ answer | safe }}</div>
        </div>
      {% endif %}
      <div class="chatbox">
        <h2>Ask Questions</h2>
        <form method="post">
          <textarea name="question" rows="4" placeholder="Type your question here...">{{ question }}</textarea><br>
          <input type="submit" value="Ask">
        </form>
      </div>
      {% if followup %}
        <div class="followup-box">
          <strong>Follow-up Answer:</strong>
          <div>{{ followup | safe }}</div>
        </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
